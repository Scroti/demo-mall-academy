<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#EFEEE7">
  <title>MallAcademy — Design</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: #EFEEE7; overflow-x: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(239,238,231,0.95), rgba(239,238,231,0));
      pointer-events: none;
    }
    .back {
      pointer-events: auto;
      color: #0E1413; text-decoration: none;
      font: 500 13px/1 -apple-system, sans-serif;
      padding: 10px 12px; margin: -10px -12px;
      display: inline-flex; align-items: center; gap: 8px;
    }

    #container {
      width: 100vw;
      overflow: hidden;
      padding-top: max(50px, calc(env(safe-area-inset-top) + 40px));
    }
    #frame {
      display: block;
      border: 0;
      width: 1440px;
      height: 100vh;
      transform-origin: 0 0;
      background: #EFEEE7;
    }

    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(14,20,19,0.45); font-size: 14px;
      pointer-events: none;
      background: #EFEEE7;
      transition: opacity .25s ease;
    }
    .loading.hide { opacity: 0; }
    .loading .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #0E4F4F; margin: 0 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading .dot:nth-child(2) { animation-delay: .15s; }
    .loading .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="./" aria-label="Înapoi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>MallAcademy</span>
    </a>
  </div>

  <div class="loading" id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>

  <div id="container">
    <iframe id="frame" src="design-preview.html" title="MallAcademy Design Preview"></iframe>
  </div>

  <script>
    const DESIGN_W = 1440;
    const frame = document.getElementById('frame');
    const container = document.getElementById('container');
    const loading = document.getElementById('loading');

    function fit() {
      const w = Math.min(window.innerWidth, document.documentElement.clientWidth);
      // Scale only when narrower than design; on desktop, show 1:1 capped at design width
      const scale = Math.min(1, w / DESIGN_W);
      let ch = 0;
      try {
        const doc = frame.contentDocument;
        if (doc && doc.documentElement) {
          ch = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
        }
      } catch (e) {}
      if (ch < 200) ch = window.innerHeight;

      frame.style.height = ch + 'px';
      frame.style.transform = `scale(${scale})`;
      container.style.height = (ch * scale) + 'px';

      if (scale === 1) {
        // Desktop: center the iframe
        frame.style.margin = '0 auto';
      } else {
        frame.style.margin = '0';
      }
    }

    let firstFitDone = false;
    function tryFit() {
      fit();
      if (!firstFitDone) {
        try {
          const doc = frame.contentDocument;
          if (doc && doc.documentElement && doc.documentElement.scrollHeight > 200) {
            firstFitDone = true;
            loading.classList.add('hide');
            setTimeout(() => loading.remove(), 300);
          }
        } catch (e) {}
      }
    }

    frame.addEventListener('load', () => {
      tryFit();
      try {
        const obs = new MutationObserver(() => tryFit());
        obs.observe(frame.contentDocument.documentElement, { childList: true, subtree: true, attributes: true });
      } catch (e) {}
      // Poll for ~10s — bundle unpacks async
      let n = 0;
      const t = setInterval(() => { tryFit(); if (++n > 40) clearInterval(t); }, 250);
    });

    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', () => setTimeout(fit, 200));
  </script>
</body>
</html>
