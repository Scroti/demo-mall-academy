<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#0E1413">
  <title>MallAcademy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: #0E1413; color: #fff; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10; pointer-events: none;
      background: linear-gradient(to bottom, rgba(14,20,19,0.85), rgba(14,20,19,0));
    }
    .back {
      pointer-events: auto;
      color: #fff; text-decoration: none;
      font: 500 13px/1 -apple-system, sans-serif;
      padding: 10px 12px; margin: -10px -12px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .counter {
      font: 500 12px/1 -apple-system, sans-serif;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
      background: rgba(0,0,0,0.35);
      padding: 6px 10px; border-radius: 999px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }

    .pages {
      width: 100vw;
      height: 100vh; height: 100dvh;
      overflow-y: scroll; overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .page {
      width: 100vw;
      height: 100vh; height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
      padding-top: max(60px, calc(env(safe-area-inset-top) + 50px));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .page canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      border-radius: 4px;
      background: #fff;
    }

    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5); font-size: 14px;
    }
    .loading .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      margin: 0 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading .dot:nth-child(2) { animation-delay: .15s; }
    .loading .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    .error {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      color: rgba(255,255,255,0.7);
      font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="./" aria-label="Înapoi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span id="back-title">MallAcademy</span>
    </a>
    <span class="counter" id="counter" hidden></span>
  </div>

  <div class="loading" id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="pages" id="pages" hidden></div>

  <script type="module">
    const PDFJS_VERSION = '4.0.379';
    const CDN = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build`;

    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const title = params.get('title');
    if (title) document.getElementById('back-title').textContent = title;

    const loading = document.getElementById('loading');
    const pagesEl = document.getElementById('pages');
    const counterEl = document.getElementById('counter');

    function showError(msg) {
      loading.remove();
      const e = document.createElement('div');
      e.className = 'error';
      e.textContent = msg;
      document.body.appendChild(e);
    }

    if (!file) { showError('Lipsește fișierul.'); throw new Error('no file'); }

    try {
      const pdfjs = await import(`${CDN}/pdf.min.mjs`);
      pdfjs.GlobalWorkerOptions.workerSrc = `${CDN}/pdf.worker.min.mjs`;

      const pdf = await pdfjs.getDocument(file).promise;
      const total = pdf.numPages;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Available space inside .page (viewport minus padding/topbar)
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const insetTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('padding-top')) || 0;
      const padTop = Math.max(60, insetTop + 50);
      const padBottom = 20;
      const sidePad = 12;
      const availW = vw - sidePad * 2;
      const availH = vh - padTop - padBottom;

      for (let i = 1; i <= total; i++) {
        const page = await pdf.getPage(i);
        const v1 = page.getViewport({ scale: 1 });
        const scale = Math.min(availW / v1.width, availH / v1.height);
        const viewport = page.getViewport({ scale: scale * dpr });

        const wrap = document.createElement('div');
        wrap.className = 'page';
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = (viewport.width / dpr) + 'px';
        canvas.style.height = (viewport.height / dpr) + 'px';
        wrap.appendChild(canvas);
        pagesEl.appendChild(wrap);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        if (i === 1) {
          loading.remove();
          pagesEl.hidden = false;
        }
      }

      counterEl.hidden = false;
      function updateCounter() {
        const idx = Math.min(total, Math.max(1, Math.round(pagesEl.scrollTop / window.innerHeight) + 1));
        counterEl.textContent = `${idx} / ${total}`;
      }
      pagesEl.addEventListener('scroll', updateCounter, { passive: true });
      updateCounter();
    } catch (err) {
      showError('Nu am putut încărca documentul. ' + (err?.message || ''));
      console.error(err);
    }
  </script>
</body>
</html>
