<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFEEE7">
  <title>MallAcademy</title>
  <style>
    :root {
      --bg: #EFEEE7;
      --ink: #0E1413;
      --muted: #5B6664;
      --teal: #0E4F4F;
      --accent: #C77B2C;
      --line: rgba(14,20,19,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(44px, 12vw, 56px);
      line-height: 1;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
    }
    h1 .dot { color: var(--accent); font-style: normal; }
    nav { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
    a {
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      padding: 20px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 17px;
      transition: background .15s ease;
    }
    a:active { background: rgba(14,79,79,0.06); }
    @media (hover: hover) {
      a:hover { background: rgba(14,79,79,0.04); }
    }
    a .label { display: flex; flex-direction: column; gap: 2px; }
    a .kind {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    a .title { font-weight: 500; }
    a .arrow { color: var(--teal); flex-shrink: 0; }
    a:first-child .arrow { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>MallAcademy<span class="dot">.</span></h1>
    <nav>
      <a href="view-design.html">
        <span class="label">
          <span class="kind">Interactiv</span>
          <span class="title">Design Preview</span>
        </span>
        <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a href="viewer.html?file=plan-de-executare.pdf&amp;title=Plan%20de%20executare">
        <span class="label">
          <span class="kind">PDF</span>
          <span class="title">Plan de executare</span>
        </span>
        <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a href="viewer.html?file=architecture.pdf&amp;title=Arhitectur%C4%83">
        <span class="label">
          <span class="kind">PDF</span>
          <span class="title">Arhitectură</span>
        </span>
        <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
